name: uptime
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check heartbeat
        env:
          HB_URL: ${{ secrets.HB_URL }}
        run: |
          body=$(curl -sS -m 20 --retry 2 "$HB_URL")
          set -- $body
          age=$(( $(date -u +%s) - $1 ))
          echo "heartbeat age $age s, feed age $2 s, running $3"
          [ "$age" -lt 900 ] || { echo "host: heartbeat older than 15 min"; exit 1; }
          [ "$2" -ge 0 ] && [ "$2" -lt 900 ] || { echo "core: feed older than 15 min"; exit 1; }
          [ "$3" = "t" ] || { echo "core: not running"; exit 1; }
